name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.0.2)'
        required: true
      next-snapshot:
        description: 'Next SNAPSHOT version'
        required: true
        default: '0.0.3-SNAPSHOT'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set release version
        run: ./mvnw versions:set -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false -q

      - name: Build and test
        run: ./mvnw install -B

      - name: Deploy to Maven Central
        run: ./mvnw deploy -Ppublish,release -DskipTests -B
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Tag and push
        run: ./scripts/release/tag-and-push.sh "${{ inputs.version }}"

      - name: Back to SNAPSHOT
        run: ./scripts/release/back-to-snapshot.sh "${{ inputs.next-snapshot }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ inputs.version }}" --title "v${{ inputs.version }}" --generate-notes --verify-tag

      - name: Announce the release on stubborn.sh
        # Turns the release notes into a blog post. Best effort: the website
        # also sweeps published releases on a schedule.
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: scripts/release/announce-website.sh stubborn-openapi "${{ inputs.version }}"
