name: Publish GitHub Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0) — must be an existing git tag v<version>'
        required: true

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ inputs.version }} already exists — nothing to do."
          else
            gh release create "v${{ inputs.version }}" \
              --title "v${{ inputs.version }}" \
              --generate-notes \
              --verify-tag
          fi
